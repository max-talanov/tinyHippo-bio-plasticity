ral">PYR ↔ interneuron (6–11; 6–8 leave from the PYR soma): one TMSyn per projection, weight K·ĝ (K = 10 out of PYR, 5 into PYR)</text><text class="ts" x="40" y="968" dominant-baseline="central">standing in for a population; spike detection at the presynaptic soma(0.5), threshold 0 mV.</text><text class="ts" x="40" y="986" dominant-baseline="central">ĝ: Ecker et al. 2019 Table 1 (PYR ↔ interneuron); SC and T ĝ assumed. STP: params.PATHWAYS (secondary sources). Fixed step 0.025 ms after 20 s rest at dt 10 ms.</text><text class="ts" x="40" y="1004" dominant-baseline="central">Not in the circuit yet: NMDA, presynaptic A1R (mod/TMSynPI, verified alone), tag and capture. Synapse placement on PYR layers waits on circuit._place.</text></svg>
