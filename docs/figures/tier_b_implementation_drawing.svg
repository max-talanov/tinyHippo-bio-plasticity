ral">202 sections, 34 °C, refit</text><g class="c-teal"><rect x="350" y="110" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="460.0" y="133.0" text-anchor="middle" dominant-baseline="central">Apical dist (SLM)</text><text class="ts" x="460.0" y="151.0" text-anchor="middle" dominant-baseline="central">63 sec, 3.3 mm</text></g><g class="c-teal"><rect x="350" y="210" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="460.0" y="233.0" text-anchor="middle" dominant-baseline="central">Apical prox (SR)</text><text class="ts" x="460.0" y="251.0" text-anchor="middle" dominant-baseline="central">64 sec, 3.4 mm</text></g><g class="c-teal"><rect x="350" y="310" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="460.0" y="333.0" text-anchor="middle" dominant-baseline="central">Soma + axon (SP)</text><text class="ts" x="460.0" y="351.0" text-anchor="middle" dominant-baseline="central">Na, Kdr, KA, HCN, leak</text></g><g class="c-teal"><rect x="350" y="410" width="220" height="64" rx="8" stroke-width="0.5"/><text class="th" x="460.0" y="433.0" text-anchor="middle" dominant-baseline="central">Basal (SO)</text><text class="ts" x="460.0" y="451.0" text-anchor="middle" dominant-baseline="central">60 sec, 3.3 mm</text></g><text class="ts" x="460" y="500" text-anchor="middle" dominant-baseline="central">scales: leak 0.30, Na 0.69, Kdr 1.46</text><text class="ts" x="460" y="520" text-anchor="middle" dominant-baseline="central">HCN 0.10, KA 1.57, e_pas -75.2 mV</text><g class="c-pink"><rect x="720" y="110" width="240" height="64" rx="8" stroke-width="0.5"/><text class="th" x="840.0" y="133.0" text-anchor="middle" dominant-baseline="central">O-LM (published)</text><text class="ts" x="840.0" y="151.0" text-anchor="middle" dominant-baseline="central">soma, 2 dend, axon; eh −32.9</text></g><g class="c-pink"><rect x="720" y="210" width="240" height="64" rx="8" stroke-width="0.5"/><text class="th" x="840.0" y="233.0" text-anchor="middle" dominant-baseline="central">Bistratified (refit)</text><text class="ts" x="840.0" y="251.0" text-anchor="middle" dominant-baseline="central">soma, 2 apical + 2 basal trees</text></g><g class="c-pink"><rect x="720" y="310" width="240" height="64" rx="8" stroke-width="0.5"/><text class="th" x="840.0" y="333.0" text-anchor="middle" dominant-baseline="central">PV basket (published)</text><text class="ts" x="840.0" y="351.0" text-anchor="middle" dominant-baseline="central">soma, 2 apical + 2 basal trees</text></g><path d="M240 170 H285 V232 H348" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><circle class="badge" cx="285" cy="200" r="9"/><text class="tb" x="285" y="200" text-anchor="middle" dominant-baseline="central">1</text><path d="M240 320 H300 V252 H348" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><circle class="badge" cx="300" cy="290" r="9"/><text class="tb" x="300" y="290" text-anchor="middle" dominant-baseline="central">2</text><path d="M240 370 H300 V442 H348" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><circle class="badge" cx="300" cy="410" r="9"/><text class="tb" x="300" y="410" text-anchor="middle" dominant-baseline="central">3</text><path d="M80 400 V590 H985 V242 H962" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><path d="M985 342 H962" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><circle class="badge" cx="985" cy="290" r="9"/><text class="tb" x="985" y="290" text-anchor="middle" dominant-baseline="central">4</text><circle class="badge" cx="985" cy="400" r="9"/><text class="tb" x="985" y="400" text-anchor="middle" dominant-baseline="central">5</text><path d="M600 130 H718" fill="none" stroke="#639922" stroke-width="1.6" marker-end="url(#ag)"/><circle class="badge" cx="660" cy="130" r="9"/><text class="tb" x="660" y="130" text-anchor="middle" dominant-baseline="central">6</text><path d="M720 156 H572" fill="none" stroke="