<text x="570.0" y="391.0" class="h" fill="#712B13" text-anchor="middle" dominant-baseline="central">Apical dist</text>
<text x="570.0" y="409.0" class="s" fill="#993C1D" text-anchor="middle" dominant-baseline="central">SLM</text>
