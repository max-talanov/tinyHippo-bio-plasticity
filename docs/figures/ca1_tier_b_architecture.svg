<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>Tier-B CA1 circuit</title>
<desc>Schaffer collateral and tagged T inputs drive one pyramidal cell (basal, soma, apical proximal, apical distal) and three interneurons: PV basket, bistratified, O-LM. Red-orange arrows are excitatory, blue arrows inhibitory.</desc>
<style>text{font-family:Helvetica,Arial,sans-serif} .h{font-size:14px;font-weight:500} .s{font-size:12px}</style>
<defs><marker id="aD85A30" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a378ADD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="580" fill="#ffffff"/>
<rect x="200" y="40" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330.0" y="53.0" class="h" fill="#444441" text-anchor="middle" dominant-baseline="central">Schaffer collateral (CA3)</text>
<text x="330.0" y="71.0" class="s" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">VecStim spike trains</text>
<rect x="195" y="190" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="255.0" y="206.0" class="h" fill="#0C447C" text-anchor="middle" dominant-baseline="central">PV basket</text>
<text x="255.0" y="224.0" class="s" fill="#185FA5" text-anchor="middle" dominant-baseline="central">soma target</text>
<rect x="335" y="190" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="395.0" y="206.0" class="h" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Bistratified</text>
<text x="395.0" y="224.0" class="s" fill="#185FA5" text-anchor="middle" dominant-baseline="central">SR and SO</text>
<rect x="500" y="190" width="120" height="50" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="560.0" y="206.0" class="h" fill="#0C447C" text-anchor="middle" dominant-baseline="central">O-LM</text>
<text x="560.0" y="224.0" class="s" fill="#185FA5" text-anchor="middle" dominant-baseline="central">SLM, feedback</text>
<rect x="40" y="330" width="610" height="150" rx="14" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="60" y="462" class="s" fill="#5F5E5A">PYR: CA1 pyramidal cell, 4 sections</text>
<rect x="60" y="370" width="120" height="60" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="120.0" y="391.0" class="h" fill="#712B13" text-anchor="middle" dominant-baseline="central">Basal</text>
<text x="120.0" y="409.0" class="s" fill="#993C1D" text-anchor="middle" dominant-baseline="central">SO</text>
